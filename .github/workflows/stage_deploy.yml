name: Deploy LibreChat

on:
  push:
    branches: [stage]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stage
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat << EOF > .env
          HOST=0.0.0.0
          PORT=3080
          
          MONGO_URI=mongodb://mongodb:27017/LibreChat
          
          DOMAIN_CLIENT=https://staging-librechat.farmjournal.com
          DOMAIN_SERVER=https://staging-librechat.farmjournal.com
          
          NO_INDEX=true
          TRUST_PROXY=1
          
          CREDS_KEY=${{ secrets.CREDS_KEY }}
          CREDS_IV=${{ secrets.CREDS_IV }}
          
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          
          SESSION_EXPIRY=1000 * 60 * 15
          REFRESH_TOKEN_EXPIRY=(1000 * 60 * 60 * 24) * 7
          
          MEILI_MASTER_KEY=${{ secrets.MEILI_MASTER_KEY }}
          MEILI_HOST=http://meilisearch:7700
          
          OPENAI_API_KEY=user_provided
          ANTHROPIC_API_KEY=user_provided
          GOOGLE_API_KEY=user_provided
          
          ALLOW_REGISTRATION=true
          ALLOW_SOCIAL_LOGIN=false
          
          GITHUB_REPO=${{ github.repository }}
          EOF

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.ec2.yml,.env,librechat.yaml"
          target: /opt/librechat
          overwrite: true

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/librechat
            
            # Rename compose file
            mv -f docker-compose.ec2.yml docker-compose.yml 2>/dev/null || true
            
            # Create required directories
            mkdir -p images uploads logs data-node meili_data_v1.12
            
            # Login to GitHub Container Registry
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Stop existing containers
            docker compose down --remove-orphans 2>/dev/null || true
            
            # Pull latest image and start
            docker compose pull
            docker compose up -d
            
            echo "=== Container Status ==="
            docker compose ps
            
            sleep 10
            
            echo "=== Health Check ==="
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:3080/api/health || echo "Pending..."
